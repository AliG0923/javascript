<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Loop</title>
</head>
<body>
    <script>
        function testLoop(evaluar) {
            let numero = evaluar;

            while (numero <= 10) {
                console.log(numero);
                numero++;
            }
        }

        const respuesta = parseInt(prompt("Ingresa un número menor o igual a 10"));
        testLoop(respuesta);
    </script>
</body>
</html>
