<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        let numero

        do {
            numero = prompt("Dime un numero");

        } while (numero != "10");

        document.write("<h1>Exactamente, ese es el numero!</h1")
    </script>
