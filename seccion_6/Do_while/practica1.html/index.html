<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 1</title>
</head>
<body>
    <script>
        function testLoop(vueltasTotales) {
    if (isNaN(vueltasTotales) || vueltasTotales <= 0) {
        console.log("Por favor, introduce un número de vueltas válido mayor a 0.");
        return;
    }

    let contador = 1;

    do {
        console.log("Vuelta número: " + contador);
        contador++;
    } while (contador <= vueltasTotales);
}

let entradaUsuario = prompt("¿Cuántas vueltas quiere?");
let numeroDeVueltas = parseInt(entradaUsuario);

testLoop(numeroDeVueltas);

    </script>
</body>
</html>
