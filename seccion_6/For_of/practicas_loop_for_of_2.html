<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensaje</title>
</head>
<body>
    <script>
        let miArray =['Hola ', ' Me llamo ', ' Alison'];
        let saludo = "";
        function testLoop(mensajeUsuario){
            for(const mensaje of mensajeUsuario){
                saludo += mensaje;
            }
            console.log(saludo);
        }
        testLoop(miArray);
    </script>
</body>
</html>
