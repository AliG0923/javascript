<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Loop Array</title>
</head>
<body>
    <script>
        let miArray = [5,9,6.4,8];
        let suma = 0;

        function testLoop(sumaNumeros) {
            for (const numero of sumaNumeros) {
                suma += numero;
            }
            console.log(suma);
        }

        testLoop(miArray);
    </script>
</body>
</html>
