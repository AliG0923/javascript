<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica</title>
</head>
<body>
    <script>
        function testLoop(){
        let miArray = [9, 5, 6, 2, 7];

        for (let numero of miArray){
            if (numero <= 5){
                document.write(numero + "<br>");
            }else {
                continue;
                document.write("numero mayor a 5");
            }
        }
        
        document.write("Eso es todo<br>");
    }
    testLoop();
    </script>
</body>
</html>
