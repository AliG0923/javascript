    <script>

            resultado = primeroNum + segundoNum;
            return resultado;
        }

        function sumar(){
           let elementoprimerNum= parseInt(document.getElementById("primeroNum").value);
           let elementosegundoNum = parseInt(document.getElementById("segundoNum").value); 
           let elementoSuma = suma (elementoprimerNum,
            elementosegundoNum);
            alert(elementoSuma);
        }
    </script>
</body>
