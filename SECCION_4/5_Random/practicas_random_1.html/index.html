<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random 1</title>
</head>
<body>
    <button onclick="mostrarMensaje()">Click aqui</button>
    
    <script>
        function mostrarMensaje(){
            let aleatorio = Math.floor(Math.random() * (51 - 10)+ 10);
            alert(aleatorio);
        }
    </script>
</body>
</html>
