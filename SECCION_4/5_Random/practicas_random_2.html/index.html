<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random 2</title>
</head>
<body>
    <button onclick="mostrarMensaje()">click aqui</button>

    <script>
        function mostrarMensaje(){
            let aleatorio = Math.floor(Math.random() * (101 - 50) + 50);
            alert(aleatorio);
        }
    </script>
</body>
</html>
